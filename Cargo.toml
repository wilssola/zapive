[package]
name = "zapive"
version = "0.2.0"
edition = "2024"
description = "Native WhatsApp desktop client"
publish = false

[dependencies]
# FemtoVG (OpenGL) renders; the software renderer stays as the fallback
# for GL-less sessions like RDP.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
# default features pull in `simd`, which needs nightly (portable_simd); pick the
# stable set explicitly instead.
whatsapp-rust = { version = "=0.7.0", default-features = false, features = [
    "signal",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
image = "0.25"
qrcode = "0.14"
sys-locale = "0.3"
# Must resolve to the same libsqlite3-sys (0.37) that whatsapp-rust's
# diesel links, or cargo refuses the duplicate native sqlite3.
rusqlite = { version = "0.39", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.9"
zeroize = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
url = "2"
arboard = "3"
kamadak-exif = "0.5"
ureq = "3"
cpal = "0.16"
rfd = "0.15"
webp = "0.3"
ogg = "0.9.2"
mp4 = "0.14.0"
openh264 = { version = "0.9.8", features = ["source"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "flac", "vorbis", "ogg", "pcm"] }
bytes = "1.12.1"
opus-pure = "0.2.1"
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate", "ureq", "github"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Notifications with the app's own identity: the notification center on
# macOS (bundle icon instead of the osascript script icon) and D-Bus on
# Linux (works inside Flatpak, carries the desktop-entry icon).
notify-rust = "4"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Full debuginfo made target/ balloon past 7 GB; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
