[package]
name = "zapive"
version = "0.1.0"
edition = "2024"
description = "Native WhatsApp desktop client"
publish = false

[dependencies]
slint = "1.17"
# default features pull in `simd`, which needs nightly (portable_simd); pick the
# stable set explicitly instead.
whatsapp-rust = { version = "=0.7.0", default-features = false, features = [
    "signal",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
image = "0.25"
qrcode = "0.14"
ffmpeg-next = "9"
sys-locale = "0.3"
# Must resolve to the same libsqlite3-sys (0.37) that whatsapp-rust's
# diesel links, or cargo refuses the duplicate native sqlite3.
rusqlite = { version = "0.39", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.9"
zeroize = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
url = "2"
arboard = "3"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
slint-build = "1.17"

# Full debuginfo made target/ balloon past 7 GB; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
