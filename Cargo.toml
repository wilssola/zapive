[package]
name = "zapive"
version = "0.6.2"
edition = "2024"
description = "Native WhatsApp desktop client"
publish = false

[dependencies]
# FemtoVG (OpenGL) renders; the software renderer stays as the fallback
# for GL-less sessions like RDP.
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
] }
# The feature set is picked explicitly rather than taken from the defaults,
# which carry `tokio-native` this build does not need.
# `voip-mlow` is the pure-Rust MLOW codec and `voip-relay-native` the UDP
# socket, DTLS and SCTP the media rides on -- separate features, so taking
# only the codec leaves a client that signals a call and then cannot carry
# it. `voip-libopus` is deliberately left out: it links C libopus, and the
# PCM path already encodes with MLOW.
# Pinned to a git rev, not 0.7.0: the released video `<offer>` sends
# `enc="h264" dec="h264" orientation="0"`, and WhatsApp's own `<video>`
# reader takes only `h.264`/`H264` and has no `orientation` attribute at
# all -- so it discarded the child, acked the offer and never rang the
# callee, while an audio offer to the same contact went through. Upstream
# 6966ddc rebuilt the node against that reader, and 310b969b added the
# RTCP PLI that recovers a torn picture; move back to crates.io once a
# release carries both.
whatsapp-rust = { git = "https://github.com/jlucaso1/whatsapp-rust", rev = "310b969be8bfbf5279f3df360d2d97d594f6a958", default-features = false, features = [
    "signal",
    "sqlite-storage",
    "tokio-transport",
    "tokio-runtime",
    "ureq-client",
    "voip-mlow",
    "voip-relay-native",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
image = "0.25"
qrcode = "0.14"
sys-locale = "0.3"
# Must resolve to the same libsqlite3-sys (0.38) that whatsapp-rust's
# diesel links, or cargo refuses the duplicate native sqlite3.
rusqlite = { version = "0.40", features = ["bundled"] }
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false }
rand = "0.9"
zeroize = "1"
base64 = "0.22"
# whatsapp-rust reports through `log`; without a logger installed its
# call diagnostics are dropped on the floor.
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
url = "2"
arboard = "3"
kamadak-exif = "0.5"
ureq = "3"
cpal = "0.16"
# Camera capture for video calls: MSMF/AVFoundation/V4L2 behind one API.
# `decoding` is off on purpose -- it pulls mozjpeg (C); the `image` crate
# already decodes MJPEG in pure Rust.
nokhwa = { version = "0.10", default-features = false, features = ["input-native"] }
rfd = "0.15"
webp = "0.3"
ogg = "0.9.2"
mp4 = "0.14.0"
openh264 = { version = "0.9.8", features = ["source"] }
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "wav", "flac", "vorbis", "ogg", "pcm"] }
bytes = "1.12.1"
opus-pure = "0.2.1"
self_update = { version = "1.3.0", default-features = false, features = ["rustls", "archive-zip", "compression-zip-deflate", "ureq", "github"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
tauri-winrt-notification = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Notifications with the app's own identity: the notification center on
# macOS (bundle icon instead of the osascript script icon) and D-Bus on
# Linux (works inside Flatpak, carries the desktop-entry icon).
notify-rust = "4"

[build-dependencies]
slint-build = "1.17"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Full debuginfo made target/ balloon past 7 GB; line tables keep backtraces.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
