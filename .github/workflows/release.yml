name: release

# Every push to master versions itself: the bump comes from the
# conventional-commit history since the last tag (feat! -> major,
# feat -> minor, anything else -> patch). Each platform ships a
# user-facing installer/executable (Setup.exe, AppImage, DMG) plus the
# small zapive-<target>.zip payload the in-app self-updater consumes.
on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compute next version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.1.0)
          range="$last..HEAD"
          git rev-parse "$last" >/dev/null 2>&1 || range="HEAD"
          commits=$(git log --format=%s $range)
          # chore commits never bump the version; a push made only of
          # chores ships no release at all. (chore!: still counts as a
          # breaking change below.)
          commits=$(echo "$commits" | grep -vE '^chore(\(.+\))?:' || true)
          if [ -z "$commits" ]; then
            echo "no releasable commits since $last; skipping"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          major=$(echo "$last" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$last" | sed 's/^v//' | cut -d. -f2)
          patch=$(echo "$last" | sed 's/^v//' | cut -d. -f3)
          if echo "$commits" | grep -qE '^[a-z]+(\(.+\))?!:|BREAKING CHANGE'; then
            major=$((major+1)); minor=0; patch=0
          elif echo "$commits" | grep -qE '^feat(\(.+\))?:'; then
            minor=$((minor+1)); patch=0
          else
            patch=$((patch+1))
          fi
          version="$major.$minor.$patch"
          tag="v$version"
          # Keep the sources in sync with the released version: bump
          # Cargo.toml (and the zapive entry in Cargo.lock), push that
          # commit to master and point the tag at it. Pushes made with
          # GITHUB_TOKEN never retrigger this workflow, so no loop.
          sed -i 's/^version = ".*"/version = "'"$version"'"/' Cargo.toml
          perl -0pi -e 's/(name = "zapive"\nversion = ")[^"]+/${1}'"$version"'/' Cargo.lock
          # The bump lands through the GraphQL API instead of `git commit`:
          # GitHub signs every commit it creates itself, so the release
          # commit shows up as verified without any key to manage.
          # expectedHeadOid aborts the mutation if master moved meanwhile.
          # jq reads the files off disk and the body goes in over stdin:
          # base64 of Cargo.lock is ~330 kB, well past the 128 kB ceiling
          # Linux puts on a single execve argument.
          query='
            mutation($repo:String!,$branch:String!,$oid:GitObjectID!,$msg:String!,$toml:Base64String!,$lock:Base64String!) {
              createCommitOnBranch(input:{
                branch:{repositoryNameWithOwner:$repo, branchName:$branch},
                expectedHeadOid:$oid,
                message:{headline:$msg},
                fileChanges:{additions:[
                  {path:"Cargo.toml", contents:$toml},
                  {path:"Cargo.lock", contents:$lock}
                ]}
              }) { commit { oid } }
            }'
          sha=$(jq -n \
            --arg query "$query" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg oid "$(git rev-parse HEAD)" \
            --arg msg "chore(release): $tag" \
            --rawfile toml Cargo.toml \
            --rawfile lock Cargo.lock \
            '{query: $query, variables: {repo: $repo, branch: $branch, oid: $oid,
              msg: $msg, toml: ($toml | @base64), lock: ($lock | @base64)}}' \
            | gh api graphql --input - --jq '.data.createCommitOnBranch.commit.oid')
          [ -n "$sha" ] || { echo "createCommitOnBranch returned no oid"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    strategy:
      # Each target ships its own installer, so a broken platform should
      # not throw away the builds that did work.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
            bin: zapive.exe
          - os: ubuntu-latest
            target: linux-x86_64
            bin: zapive
          - os: macos-latest
            target: macos-aarch64
            bin: zapive
    runs-on: ${{ matrix.os }}
    env:
      # Signing is optional throughout: each step runs only when its
      # certificate secret exists, so forks still release unsigned.
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
      MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
      # Azure Artifact Signing (formerly Trusted Signing; the action kept
      # the old name) is optional: the signing steps only run when the
      # secrets are configured, so forks and local setups still release
      # unsigned binaries. AZURE_TS_ENDPOINT is the regional URI, e.g.
      # https://brs.codesigning.azure.net for Brazil South.
      # AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      # The tag points at the version-bump commit the version job pushed,
      # so the build compiles exactly what the tag says.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - name: Desktop libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxdo-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked

      # ---- Windows: sign, then wrap the exe in an installer that creates
      # ---- the Start Menu (and optional Desktop) shortcuts.
      # - name: Sign binary (Azure Artifact Signing)
      #   if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
      #   uses: azure/trusted-signing-action@v2
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
      #     signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
      #     files-folder: target/release
      #     files-folder-filter: exe
      #     file-digest: SHA256
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256
      - name: Sign binary (self-signed)
        if: runner.os == 'Windows' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: packaging\windows\sign.ps1 -Path target\release\zapive.exe
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=${{ needs.version.outputs.version }} packaging\windows\zapive.iss
      - name: Sign installer (self-signed)
        if: runner.os == 'Windows' && env.WINDOWS_PFX_BASE64 != ''
        shell: pwsh
        run: packaging\windows\sign.ps1 -Path dist\Zapive-Setup-${{ needs.version.outputs.version }}.exe
      # - name: Sign installer (Azure Artifact Signing)
      #   if: runner.os == 'Windows' && env.AZURE_TENANT_ID != ''
      #   uses: azure/trusted-signing-action@v2
      #   with:
      #     azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
      #     endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
      #     signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
      #     certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
      #     files-folder: dist
      #     files-folder-filter: exe
      #     file-digest: SHA256
      #     timestamp-rfc3161: http://timestamp.acs.microsoft.com
      #     timestamp-digest: SHA256

      # ---- Linux: AppImage (desktop entry + icon, no terminal window).
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/linux/make-appimage.sh "${{ needs.version.outputs.version }}"

      # ---- macOS: .app bundle (icon + no Terminal window) inside a DMG.
      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/zapive.keychain-db"
          p12="$RUNNER_TEMP/zapive.p12"
          echo "$MACOS_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$MACOS_P12_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$MACOS_P12_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_P12_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
      - name: Build app bundle and DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          identity='-'
          [ -n "$MACOS_P12_BASE64" ] && identity='Zapive Self-Signed'
          bash packaging/macos/make-bundle.sh "${{ needs.version.outputs.version }}" "$identity"

      # The updater swaps this binary into the installed bundle, so it has
      # to carry the bundle identifier and the app's own signature or the
      # bundle stops launching.
      - name: Sign updater payload (macOS)
        if: runner.os == 'macOS'
        run: |
          identity='-'
          [ -n "$MACOS_P12_BASE64" ] && identity='Zapive Self-Signed'
          codesign --force --identifier io.github.wilssola.Zapive --sign "$identity" target/release/zapive

      # The self-updater downloads this bare-binary zip; on Windows it is
      # zipped after signing, so updated installs stay signed.
      - name: Updater payload
        shell: bash
        run: |
          mkdir -p dist
          cd target/release
          7z a "../../dist/zapive-${{ matrix.target }}.zip" "${{ matrix.bin }}" || zip "../../dist/zapive-${{ matrix.target }}.zip" "${{ matrix.bin }}"
      - uses: actions/upload-artifact@v7
        with:
          name: zapive-${{ matrix.target }}
          path: dist/*

  release:
    needs: [version, build]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ needs.version.outputs.tag }}"
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || echo "")
          range=${prev:+$prev..}$tag
          # Commit subjects only: trailers and bodies stay out of the
          # notes, and so does the version-bump commit itself.
          notes=$(git log --format='- %s' "$range" | grep -v '^- chore(release):' || true)
          # Checksums: listed in the notes and shipped as an asset, so a
          # download can always be verified against the release page.
          sha256sum Zapive-* zapive-*.zip > SHA256SUMS.txt
          {
            echo "$notes"
            echo
            echo "## SHA-256"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "Zapive $tag" \
            --notes-file notes.md \
            Zapive-* zapive-*.zip SHA256SUMS.txt
