name: flatpak

# Prepared, not published: builds an installable zapive.flatpak bundle from
# packaging/flatpak/io.github.wilssola.Zapive.yml on demand, so the manifest
# stays verified until we submit to Flathub (see packaging/flatpak/README.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-aiohttp python3-toml
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Generate offline cargo sources
        run: |
          curl -fsSL -o /tmp/flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 /tmp/flatpak-cargo-generator.py Cargo.lock -o packaging/flatpak/cargo-sources.json
      - name: Build
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean \
            --repo=flatpak-repo builddir packaging/flatpak/io.github.wilssola.Zapive.yml
      - name: Bundle
        run: flatpak build-bundle flatpak-repo zapive.flatpak io.github.wilssola.Zapive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zapive-flatpak
          path: zapive.flatpak
