name: check

# One fast gate on Linux, run on pull requests, pushes to master and on
# demand. It compiles the code once, with the demo feature (a superset of
# the release build), and reuses that build for clippy and the tests.
# The three platform release builds live only in release.yml; repeating
# them here doubled every merge's CI time for no extra signal.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI builds from scratch every time; incremental artifacts only cost time.
  CARGO_INCREMENTAL: 0
  # Line tables are enough for test backtraces and shrink the build a lot.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: lint and test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Desktop libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libgtk-3-dev libxdo-dev cmake build-essential xvfb libxkbcommon-x11-0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests reuse the cache saved by master instead of each
          # starting cold.
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --features demo -- -D warnings
      # Some tests create a real Slint window, which needs a display.
      - name: Tests
        run: xvfb-run -a cargo test --locked --features demo
      - name: Release notes generator
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  # A new advisory can appear without any change here, so it never blocks
  # an unrelated pull request; the weekly run and master pushes fail loudly.
  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache cargo-audit
        id: cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}
      - name: Install cargo-audit
        if: steps.cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - name: Audit locked dependencies
        run: cargo audit
