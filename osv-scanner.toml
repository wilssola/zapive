# OSV-Scanner configuration, picked up from the directory that holds Cargo.lock.
#
# Every entry below is an "unmaintained crate" RUSTSEC advisory: none describes
# an exploitable vulnerability, and none has a fixed release to upgrade to.
# Each is ignored by ID, with an expiry, so the scanner keeps flagging any new
# advisory (including a real vulnerability in these same crates).
# Re-review before the ignoreUntil date; remove an entry as soon as the
# upstream dependency drops the crate.

# Build-time only: pulled by slint-build -> i-slint-compiler, never linked
# into the shipped binary.
